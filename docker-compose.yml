# 本地开发环境 —— 仅启动 PostgreSQL + Redis
# 用法：docker compose up -d
# 停止：docker compose down
# 清除数据：docker compose down -v

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_pass_123
      POSTGRES_DB: splitter_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - splitter_dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass dev_redis_123
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - splitter_dev

networks:
  splitter_dev:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
