<style>
:root {
  --surface: #F7F7F8; --surface-muted: #EFEFF2;
  --text: #171717; --text-muted: #52525B;
  --border: rgba(23,23,23,0.12);
  --brand: #4B3FE3; --brand-soft: #F2F7FF; --brand-text: #1A1759;
  --accent: #27D2BF; --accent-soft: #EAFBF8; --accent-text: #0F766E;
  --danger: #E8463A;
  --font-sans: "SF Pro Text","PingFang SC",system-ui,sans-serif;
  --text-caption: 12px/18px; --text-body: 14px/20px; --text-title: 16px/24px;
  --spacer-8: 8px; --spacer-12: 12px; --spacer-16: 16px; --spacer-20: 20px; --spacer-24: 24px;
  --radius: 8px; --radius-card: 12px; --radius-full: 999px;
}
:root[data-widget-theme="dark"] {
  --surface: #171717; --surface-muted: #262626;
  --text: #E5E5E5; --text-muted: #A1A1AA;
  --border: rgba(229,229,229,0.12);
  --brand: #6054F1; --brand-soft: #1A1759; --brand-text: #CFD8FF;
  --accent: #27D2BF; --accent-soft: #123F3C; --accent-text: #CCFBF1;
  --danger: #E8463A;
}
.git-w {
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-20);
  font: 400 var(--text-body) var(--font-sans);
}
.git-w h3 {
  font: 500 var(--text-title) var(--font-sans);
  color: var(--text);
  margin: 0 0 var(--spacer-4) 0;
}
.git-w .sub {
  font: 400 var(--text-caption) var(--font-sans);
  color: var(--text-muted);
  margin: 0 0 var(--spacer-20) 0;
}
.git-svg { width: 100%; height: auto; display: block; }
.git-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacer-16);
  margin-top: var(--spacer-16);
  padding: var(--spacer-12) var(--spacer-16);
  background: var(--surface-muted);
  border-radius: var(--radius);
}
.git-legend-item {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  font: 400 var(--text-caption) var(--font-sans);
  color: var(--text-muted);
}
.git-legend-dot {
  width: 12px; height: 12px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}
.git-steps {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacer-12);
  margin-top: var(--spacer-16);
}
.git-step-tag {
  display: inline-flex;
  align-items: center;
  padding: var(--spacer-4) var(--spacer-12);
  border-radius: var(--radius-full);
  font: 500 var(--text-caption) var(--font-sans);
}
.git-step-dev { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent); }
.git-step-bug { background: var(--surface-muted); color: var(--text-muted); border: 1px solid var(--border); }
.git-step-rel { background: var(--brand-soft); color: var(--brand-text); border: 1px solid var(--brand); }
.git-step-hot { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border: 1px solid var(--danger); }
</style>

<div class="git-w" data-dynamic-ui-widget data-template="node-flow" data-mounted="true">
<h3>GitHub Flow 分支模型</h3>
<p class="sub">功能开发 → 测试环境 → 生产发布 · 含 Bug 修复与紧急修复</p>

<svg class="git-svg" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="git-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="git-arr-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--brand)"/>
    </marker>
    <marker id="git-arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--accent)"/>
    </marker>
    <marker id="git-arr-danger" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--danger)"/>
    </marker>
  </defs>

  <!-- ====== main branch line (bottom) ====== -->
  <line x1="60" y1="380" x2="660" y2="380" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="30" y="385" font="500 14px var(--font-sans, sans-serif)" fill="var(--brand)" text-anchor="end">main</text>
  <text x="30" y="400" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="end">生产</text>

  <!-- main nodes -->
  <circle cx="180" cy="380" r="6" fill="var(--brand)"/>
  <text x="180" y="408" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">初始版本</text>

  <circle cx="540" cy="380" r="6" fill="var(--brand)"/>
  <text x="540" y="408" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">生产发布</text>

  <!-- ====== develop branch line (middle) ====== -->
  <line x1="120" y1="220" x2="600" y2="220" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="30" y="225" font="500 14px var(--font-sans, sans-serif)" fill="var(--accent)" text-anchor="end">develop</text>
  <text x="30" y="240" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="end">测试</text>

  <!-- develop nodes -->
  <circle cx="180" cy="220" r="5" fill="var(--accent)"/>
  <circle cx="320" cy="220" r="5" fill="var(--accent)"/>
  <text x="320" y="208" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">合并功能</text>

  <circle cx="440" cy="220" r="5" fill="var(--accent)"/>
  <text x="440" y="208" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">合并修复</text>

  <!-- develop → main PR arrow (release) -->
  <path d="M 480 226 C 500 280 520 340 535 374" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 3" marker-end="url(#git-arr-brand)"/>
  <rect x="478" y="288" width="72" height="20" rx="10" fill="var(--surface)" stroke="var(--brand)" stroke-width="1"/>
  <text x="514" y="302" font="500 12px var(--font-sans, sans-serif)" fill="var(--brand)" text-anchor="middle">PR 发布</text>

  <!-- ====== feat branch (top-left, accent) ====== -->
  <path d="M 180 220 C 200 180 220 120 240 100" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
  <line x1="240" y1="100" x2="340" y2="100" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
  <rect x="250" y="76" width="80" height="20" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="1"/>
  <text x="290" y="90" font="500 11px var(--font-sans, sans-serif)" fill="var(--accent-text)" text-anchor="middle">feat/xxx</text>
  <text x="290" y="118" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">写代码 → push</text>
  <!-- feat → develop merge -->
  <path d="M 340 100 C 330 140 325 180 322 215" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#git-arr-accent)"/>
  <rect x="338" y="148" width="48" height="18" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="362" y="161" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">PR</text>

  <!-- ====== fix branch (top-right, neutral) ====== -->
  <path d="M 440 220 C 450 180 460 140 470 120" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"/>
  <line x1="470" y1="120" x2="560" y2="120" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"/>
  <rect x="490" y="96" width="72" height="20" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="526" y="110" font="500 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">fix/xxx</text>
  <text x="526" y="138" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">修 Bug → push</text>
  <!-- fix → develop merge -->
  <path d="M 470 120 C 455 160 448 190 442 215" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" marker-end="url(#git-arr)"/>
  <rect x="478" y="168" width="48" height="18" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="502" y="181" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">PR</text>

  <!-- ====== hotfix branch (bottom, danger) ====== -->
  <path d="M 540 380 C 560 420 580 460 600 470" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="470" x2="660" y2="470" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" style="transform: translateY(-90px);" />
  <!-- hotfix branch positioned above main on right side -->
  <path d="M 540 374 C 555 350 570 330 585 318" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round"/>
  <line x1="585" y1="318" x2="660" y2="318" stroke="var(--danger)" stroke-width="2" stroke-linecap="round"/>
  <rect x="580" y="294" width="84" height="20" rx="10" fill="var(--surface)" stroke="var(--danger)" stroke-width="1"/>
  <text x="622" y="308" font="500 11px var(--font-sans, sans-serif)" fill="var(--danger)" text-anchor="middle">hotfix/xxx</text>
  <text x="622" y="336" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">紧急修复</text>
  <!-- hotfix → main direct -->
  <path d="M 585 322 C 575 340 560 360 545 374" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" marker-end="url(#git-arr-danger)"/>
  <rect x="556" y="338" width="56" height="18" rx="9" fill="var(--surface)" stroke="var(--danger)" stroke-width="1"/>
  <text x="584" y="351" font="500 11px var(--font-sans, sans-serif)" fill="var(--danger)" text-anchor="middle">PR</text>

  <!-- sync back arrow: main → develop (dashed) -->
  <path d="M 540 374 C 560 320 560 270 445 226" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#git-arr)"/>
  <rect x="510" y="280" width="64" height="18" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="542" y="293" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">同步修复</text>

  <!-- ====== CI gate labels on develop ====== -->
  <rect x="256" y="234" width="128" height="18" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="247" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">CI · 自动部署测试</text>

  <rect x="378" y="234" width="124" height="18" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="247" font="400 11px var(--font-sans, sans-serif)" fill="var(--text-muted)" text-anchor="middle">CI · 自动部署测试</text>
</svg>

<div class="git-legend">
  <div class="git-legend-item"><span class="git-legend-dot" style="background:var(--accent)"></span> develop 分支（测试环境）</div>
  <div class="git-legend-item"><span class="git-legend-dot" style="background:var(--brand)"></span> main 分支（生产环境）</div>
  <div class="git-legend-item"><span class="git-legend-dot" style="background:var(--text-muted)"></span> fix 分支（Bug 修复）</div>
  <div class="git-legend-item"><span class="git-legend-dot" style="background:var(--danger)"></span> hotfix 分支（紧急修复）</div>
</div>

<div class="git-steps">
  <span class="git-step-tag git-step-dev">开发: feat → develop → 测试</span>
  <span class="git-step-tag git-step-bug">Bug: fix → develop → 测试</span>
  <span class="git-step-tag git-step-rel">发布: develop → main → 生产</span>
  <span class="git-step-tag git-step-hot">紧急: hotfix → main → 同步 develop</span>
</div>
</div>
