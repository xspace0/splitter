name: Deploy Test

# 触发条件：CI 成功完成 + push 到 develop 分支
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  # 也支持手动触发
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false  # 部署不允许被取消

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    # 只有 CI 成功才自动部署
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取后端镜像
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Pulling backend image: $SHA"
          docker pull "ghcr.io/xspace0/splitter-backend:${SHA}"

      - name: 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 传输镜像到服务器
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Transferring backend image to server..."
          docker save "ghcr.io/xspace0/splitter-backend:${SHA}" | gzip | \
            ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "gzip -d | docker load"

      - name: 同步部署脚本到服务器
        run: |
          scp -r scripts/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/opt/splitter-test/

      - name: 通过 SSH 部署到测试环境
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /opt/splitter-test
            sed -i 's/\r$//' scripts/deploy-test.sh
            chmod +x scripts/deploy-test.sh
            bash scripts/deploy-test.sh ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 冒烟测试
        run: |
          bash scripts/smoke-test.sh \
            http://${{ secrets.SERVER_HOST }}:8081 \
            http://${{ secrets.SERVER_HOST }}:3001
